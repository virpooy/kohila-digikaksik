<!doctype html>
<html lang="et">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaksiku eelmudel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Paigutus: tööleht. Päis ja püsiv stsenaariumiriba ülal, vasakul peatükkide navigatsioon, paremal kasutusjuhud ja kaksiku ettevalmistuse materjal.
   Värvid: kaardisinine (mudel, valikud) ja planeeringuoranž (arendused, lisandumine); seisundivärvid eraldi. */
:root{
  --paper:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#14202C; --muted:#586676; --faint:#647080; --line:#D7DDE4; --line-2:#E6EAEF;
  --accent:#1F4FA0; --accent-ink:#FFFFFF; --accent-soft:#E2EAF6; --dev:#B3601D; --dev-soft:#F6E8DC;
  --good:#1D7448; --good-soft:#E0F1E7; --warn:#966000; --warn-soft:#F7EDD5; --crit:#B03535; --crit-soft:#F7E1E1;
  --grid:#E3E8EE; --shadow:0 1px 2px rgba(20,32,44,.06),0 4px 14px rgba(20,32,44,.05);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif; --f-body:"Public Sans","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E141B; --surface:#161F29; --surface-2:#1B2531; --ink:#E5EBF1; --muted:#97A5B4; --faint:#8593A2; --line:#2B3746; --line-2:#222D3A;
  --accent:#86A9E6; --accent-ink:#0E141B; --accent-soft:#1C2C46; --dev:#E19A5A; --dev-soft:#3A2818;
  --good:#62C08C; --good-soft:#163526; --warn:#E2B252; --warn-soft:#3A2F14; --crit:#E77B7B; --crit-soft:#3E1D1D;
  --grid:#243040; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141B; --surface:#161F29; --surface-2:#1B2531; --ink:#E5EBF1; --muted:#97A5B4; --faint:#8593A2; --line:#2B3746; --line-2:#222D3A;
  --accent:#86A9E6; --accent-ink:#0E141B; --accent-soft:#1C2C46; --dev:#E19A5A; --dev-soft:#3A2818;
  --good:#62C08C; --good-soft:#163526; --warn:#E2B252; --warn-soft:#3A2F14; --crit:#E77B7B; --crit-soft:#3E1D1D;
  --grid:#243040; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:22px;font-weight:700;line-height:1.2}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* päis */
header.top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;padding-block:26px 16px}
header.top .sub{max-width:72ch;color:var(--muted);margin-top:6px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.badge b{color:var(--ink);font-weight:500}
.badge.ok{border-color:transparent;background:var(--good-soft);color:var(--good)}
.badge.bad{border-color:transparent;background:var(--crit-soft);color:var(--crit)}

/* stsenaariumiriba */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:-20px;padding:10px 20px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-block:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:6px 11px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--accent-ink)}
.seg button sup{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
select,input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;min-width:0}
input[type=number]{width:96px;font-family:var(--f-mono)}
input[type=range]{accent-color:var(--accent);width:120px}

/* põhiruudustik */
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;margin-top:22px}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
nav.toc .grp{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px 10px}
nav.toc .grp:first-child{margin-top:0}
nav.toc a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:5px;border-left:2px solid transparent}
nav.toc a:hover{color:var(--ink);background:var(--surface)}
nav.toc a.on{color:var(--ink);background:var(--surface);border-left-color:var(--accent)}
nav.toc a span{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);min-width:22px}
main{display:flex;flex-direction:column;gap:30px;min-width:0}
section.ch{display:flex;flex-direction:column;gap:14px;min-width:0}
.chh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chh .lab{order:-1;flex-basis:100%}
.lead{max-width:80ch;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.box.flat{box-shadow:none}
.boxh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
@media (max-width:980px){.layout{grid-template-columns:1fr}nav.toc{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}nav.toc .grp{display:none}nav.toc a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav.toc a.on{border-bottom-color:var(--accent)}}

/* näitajad */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .lab{margin-bottom:2px}
.kpi b{font-family:var(--f-mono);font-weight:500;font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.box>.pill{align-self:flex-start}
td:first-child{white-space:nowrap}
.kpi.dev{border-color:color-mix(in srgb,var(--dev) 45%,var(--line));background:linear-gradient(180deg,var(--dev-soft),var(--surface) 70%)}

/* tabelid */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr.tot td{font-weight:600;border-top:1px solid var(--line)}
tr.sel td{background:var(--accent-soft)}
td.tx{white-space:normal;min-width:220px}
.vdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.dev{background:var(--dev-soft);color:var(--dev)} .pill.mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pos{color:var(--good)} .neg{color:var(--crit)}
.err{font-family:var(--f-mono);font-size:12.5px;padding:2px 6px;border-radius:4px}

/* vormid */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px 14px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select{width:100%}
.f small{font-size:11px;color:var(--faint)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.textout{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 14px;font-size:14px;line-height:1.65;max-width:90ch;white-space:pre-wrap}
.note{font-size:12.5px;color:var(--muted);max-width:95ch}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--ink);font-size:13px}
.callout b{color:var(--warn)}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
ol.steps li::marker{font-family:var(--f-mono);color:var(--accent)}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-2);padding:1px 5px;border-radius:4px}

/* graafikud */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--grid)}
.chart .ax{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;background:var(--c)}
.legend i.d{background:none;border-top:2px dashed var(--c);height:0}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
details.more{border-top:1px solid var(--line-2);padding-top:8px}
details.more>summary{cursor:pointer;font-size:12.5px;color:var(--accent);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more .morein{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.tile{gap:8px}
.tile h3{font-size:15.5px}
.big{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.1}
.viewsw{display:flex;flex:none;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;align-self:flex-start;background:var(--surface)}
.viewsw button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-size:13px}
.viewsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
body:not(.devview) [data-view="dev"], body.devview [data-view="dec"]{display:none !important}
.form details.more{grid-column:1/-1}
.form .adv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px 14px;align-items:end}
.loading{padding:40px 0;color:var(--muted)}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;text-decoration:none}
.skip:focus{top:12px}
.kick{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.boxh .ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.cfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.btn.sm{padding:3px 9px;font-size:12px}
.kpi.st{border-left:4px solid var(--c)}
.kpi .stw{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}
.goal{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px 24px;align-items:start}
@media (max-width:820px){.goal{grid-template-columns:1fr}}
.qa{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.qa li{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:2px solid var(--line)}
.qa .q{font-size:12px;color:var(--muted)}
.qa .a{font-size:14.5px}
.loaderr{padding:16px;border-radius:8px;background:var(--crit-soft);color:var(--crit)}
@media (max-width:700px){.bar{position:static}html{scroll-padding-top:16px}}
@media (max-width:600px){h1{font-size:25px}.wrap{padding-inline:16px}.bar{margin-inline:-16px;padding-inline:16px}.box{padding:14px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="lab">Digitaalse kaksiku eelmudel · Kohila ja Rae vald · Rapla maakond</div>
      <h1>Kaksiku eelmudel</h1>
      <p class="sub">Prognoosid, arengukava sihid ja otsuste mõju Rapla maakonna valdadele ja Rae vallale.</p>
    </div>
    <div class="badges" id="hdrBadges"><span class="badge">Laadin andmeid…</span></div>
  </header>

  <div class="bar" id="bar" hidden>
    <div class="ctl"><label>Omavalitsus</label><div class="seg" id="unitSeg"></div></div>
    <div class="ctl"><label for="migSel">Rändemuster</label><select id="migSel"></select></div>
    <div class="ctl"><label for="extraIn">Lisaränne, in/a</label><input type="number" id="extraIn" value="0" step="10"></div>
    <div class="ctl"><label for="fertIn">Sündimus</label><input type="range" id="fertIn" min="-20" max="20" step="5" value="0"><span class="mono small" id="fertOut">±0%</span></div>
  </div>

  <div id="app" class="loading">Laadin andmefaile ja kalibreerin mudelit…</div>
</div>

<script>
(function(){
"use strict";
const E = window.TwinEngine;
const FILES = ["kov","pop","fin","edu","ext","settlements","dictionary","usecases","reference"];
const S = { unit:"Kohila", mig:"mean", extra:0, fert:0 };
let D, ctx, TESTS;
const $ = s => document.querySelector(s);
const f0 = E.fmt, eur = E.eurT;
const sg = v => (Math.round(v) > 0 ? "+" : "") + f0(v);
const pc = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v * 100).toFixed(d).replace(".", ",") + "%";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- abifunktsioonid ---------- */
const unitsAll = () => D.kov.units;
const isAgg = id => !!ctx.aggregates[id];
const UN = id => isAgg(id) ? ctx.aggregates[id] : ctx.units[id];
const params = () => ({ mig: S.mig, extra: S.extra, fert: S.fert });
const projCache = new Map();
function proj(id, p) { p = p || params(); const k = id + "|" + JSON.stringify(p); if (!projCache.has(k)) { projCache.set(k, isAgg(id) ? E.projectAgg(ctx, id, p) : E.project(ctx, id, p)); if (projCache.size > 400) projCache.clear(); } return projCache.get(k); }
const ageAt = (id, y, p) => y <= 2026 ? (D.pop[id].age[String(y)]) : proj(id, p)[y];
const popAt = (id, y, p) => E.total(ageAt(id, y, p));
function eduAt(id, y, p) { if (isAgg(id)) { const r = { la:0, sc:0, pk:0 }; ctx.aggregates[id].members.forEach(m => { const d = E.eduDemand(ctx, m, ageAt(m, y, p)); r.la += d.la; r.sc += d.sc; r.pk += d.pk; }); return r; } return E.eduDemand(ctx, id, ageAt(id, y, p)); }
const formUnit = () => isAgg(S.unit) ? "Kohila" : S.unit;
const dot = id => `<span class="vdot" style="background:${UN(id).color}"></span>`;

/* ---------- joongraafik ---------- */
/* o.refs: võrdlusjooned {y, label, color, x?} – arvestatakse telje vahemikku, x korral marker sihtaastal.
   o.band: määramatuse ala [[x, lo, hi], …]. o.desc: tekstikirjeldus (väärtused, siht, trend) ekraanilugejale. */
function lineChart(el, o) {
  const W = Math.max(320, Math.round(el.clientWidth || 700)), H = o.h || 250, m = { l: 54, r: 14, t: 12, b: 26 };
  const refs = o.refs || [];
  const xs = o.series.flatMap(s => s.pts.map(p => p[0])), ys = o.series.flatMap(s => s.pts.map(p => p[1])).concat(refs.map(r => r.y)).concat((o.band || []).flatMap(b => [b[1], b[2]]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = o.y0 != null ? o.y0 : Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const span = y1 - y0, stepRaw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))), st = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= stepRaw);
  const yMax = y1; y0 = Math.floor(y0 / st) * st; y1 = Math.ceil(y1 / st) * st;
  if (refs.length && y1 - yMax < st * 0.35) y1 += st; /* ruum sihi sildile */
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r), Y = y => H - m.b - (y - y0) / (y1 - y0) * (H - m.t - m.b);
  let g = "";
  for (let v = y0; v <= y1 + 1e-9; v += st) g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${(o.yfmt || f0)(v)}</text>`;
  if (y0 > 0) g += `<text x="${m.l + 4}" y="${H - m.b - 5}" style="font-size:10px">telg ei alga nullist</text>`;
  const xstep = (x1 - x0) > 12 ? 5 : (x1 - x0) > 6 ? 2 : 1;
  for (let x = Math.ceil(x0 / xstep) * xstep; x <= x1; x += xstep) g += `<text x="${X(x)}" y="${H - 7}" text-anchor="middle">${x}</text>`;

    ${more("Kuidas see on arvutatud", `<p class="note">Ülemine hinnang: osa õpilasi käib teise valla või erakoolis ja osa koolita asulatest asub kooli lähedal. Koondrida „Muud külad” loetakse koolita asulaks.${D.edu.schoolNotes[id] ? " " + esc(D.edu.schoolNotes[id]) : ""}</p>`)}</div>` : ""}`;
  hstack($("#comChart"), ord.map(u => { const c = C(u.id); return { label: u.short + (u.id === id ? " ◂" : ""), parts: cats.map(([k, n, col]) => ({ v: c[k], color: col, name: n, op: u.id === id ? .95 : .6 })), txt: Math.round(c.tln / c.t * 100) + "% Tln" }; }), { pct: true, lw: 90, rw: 70, desc: "Töökoha asukoht: " + ord.map(u => `${u.short} Tallinnas ${Math.round(C(u.id).tln / C(u.id).t * 100)}%`).join(", ") });
  if (A) { const nos = A.rows.map((r, i) => ({ r, r36: A36.rows[i] })).filter(x => !x.r.school).sort((a, b) => b.r36.pk - a.r36.pk);
    const el = $("#pkChart"), W = Math.max(300, Math.round(el.clientWidth || 600)), lw = 140, rh = 26, Hh = 6 + nos.length * rh + 4, mx = Math.max(...nos.map(x => Math.max(x.r.pk, x.r36.pk))), X = v => lw + 10 + v / mx * (W - lw - 10 - 100);
    let g = ""; nos.forEach((x, i) => { const y = 6 + i * rh + rh / 2; g += `<text x="${lw}" y="${y + 4}" text-anchor="end" style="fill:${css("--ink")}">${esc(x.r.n)}</text><line x1="${X(Math.min(x.r.pk, x.r36.pk))}" x2="${X(Math.max(x.r.pk, x.r36.pk))}" y1="${y}" y2="${y}" stroke="${css("--line")}" stroke-width="3"/><circle cx="${X(x.r.pk)}" cy="${y}" r="5" fill="${css("--faint")}"/><circle cx="${X(x.r36.pk)}" cy="${y}" r="5" fill="${css("--dev")}"/><text x="${W - 4}" y="${y + 4}" text-anchor="end" style="fill:${css("--ink")}">${f0(x.r.pk)} → ${f0(x.r36.pk)}</text>`; });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc("Põhikooliealised koolita asulates 2026 → 2036: " + nos.map(x => `${x.r.n} ${f0(x.r.pk)} → ${f0(x.r36.pk)}`).join(", "))}">${g}</svg>`; }
}

/* 07 Täpsus */
function rTapsus() {
  const rows = unitsAll().map(u => ({ u, b: E.backtest(ctx, u.id) }));
  const maxPop = Math.max(...rows.map(r => Math.abs(r.b.errOos))), med = arr => { const a = arr.slice().sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; };
  const crit = `rahvaarvu viga alla ${Math.max(3, Math.ceil(med(rows.map(r => Math.abs(r.b.errOos))) * 100))}%, vanuserühmade keskmine viga alla ${Math.ceil(med(rows.map(r => r.b.mape)) * 100)}%`;
  $("#tapsus-body").innerHTML = `
  <div class="box">${ttl("Tagantjärele prognoos 2021 → 2026 · viga tegelikust", `5 aasta prognoosi viga oli kuni ${(maxPop * 100).toFixed(1).replace(".", ",")}%; suurimad vead on 0–4-aastastel`)}
    <div class="chart" id="btHeat"></div>${legend([{ name:"alla 3%", color:css("--good") }, { name:"3–8%", color:css("--warn") }, { name:"üle 8%", color:css("--crit") }])}
    ${more("Täpsed väärtused", table(["Omavalitsus","Tegelik 2026","Prognoos","Viga","Keskm. abs. viga","Kalibreerimise kontroll"], rows.map(({ u, b }) => [dot(u.id) + esc(u.name), f0(b.act), f0(b.oos), pc(b.errOos), (b.mape * 100).toFixed(1).replace(".", ",") + "%", pc(b.errIns, 2)])))}
    ${more("Kuidas see on arvutatud", `<p class="note">Mudel kalibreeritakse ainult 2021. aastani teada olnud andmetega (suremus ja sündimus 2016–2020, ränne 2016–2021) ja prognoositakse 2026. aasta. Kalibreerimise kontroll (2021–2026 ränne) kordab rahvaarvu alla ${(Math.max(...rows.map(r => Math.abs(r.b.errIns))) * 100 + 0.05).toFixed(1).replace(".", ",")}% veaga, see ei tõenda prognoosi täpsust. Ainult üks tagantjärele aken on avaandmetega võimalik.</p>`)}</div>
  <div class="callout"><b>Hankesse</b><span>Vastuvõtukriteerium kaksikule: ${crit}, tegelik väärtus 80% vahemikus.</span></div>`;
  const cols = ["Kokku"].concat(E.BANDS.map(b => b[0]));
  heat($("#btHeat"), rows.map(r => r.u.short), cols, (i, j) => j === 0 ? rows[i].b.errOos : rows[i].b.bands[j - 1].err, { lw: 80, desc: "Prognoosi viga: " + rows.map(r => `${r.u.short} ${pc(r.b.errOos)}`).join(", ") });
}

/* 08 Kasutusjuhud */
const USEST = { "eelmudelis":["ok","eelmudelis"], "osaliselt":["warn","osaliselt"], "kaksik":["crit","ainult kaksik"] };
function rKasutus() {
  const U = D.usecases.rows, cnt = (arr, f, k) => arr.filter(r => f(r) === k).length;
  const pOk = cnt(PROMISES, r => r[1], "ok"), uOk = cnt(U, r => r.status, "eelmudelis");
  $("#kasutus-body").innerHTML = `
  <div class="box">${ttl("Eelmudeli kate", `Ideekavandi lubadustest ${pOk}/${PROMISES.length} ja kasutusjuhtudest ${uOk}/${U.length} on eelmudelis olemas`)}
    <div class="chart" id="covChart"></div>${legend([{ name:"eelmudelis", color:css("--good") }, { name:"osaliselt", color:css("--warn") }, { name:"ainult kaksik", color:css("--crit") }])}</div>
  <div class="g3">${U.map(r => `<a class="box flat" href="#${r.section}" style="text-decoration:none;color:inherit;gap:6px"><span class="kick">${r.id} · ${esc(r.who)}</span><h3>${esc(r.name)}</h3><span><span class="pill ${USEST[r.status][0]}">${USEST[r.status][1]}</span></span></a>`).join("")}</div>
  ${more("Lubadused ja kasutusjuhud tabelina", table(["Ideekavandi lubadus","Seis","Eelmudelis","Kaksik lisab"], PROMISES.map(r => [esc(r[0]), `<span class="pill ${ST[r[1]][0]}">${ST[r[1]][1]}</span>`, esc(r[2]), `<span class="muted">${esc(r[3])}</span>`]), 9) +
    table(["Kood","Kasutusjuht","Kasutaja","Küsimus","Sisend","Väljund","Seis","Kaksik lisab"], U.map(r => [r.id, `${esc(r.name)}<br><code>${esc(r.module)}</code>`, esc(r.who), esc(r.q), esc(r.in), esc(r.out), `<span class="pill ${USEST[r.status][0]}">${USEST[r.status][1]}</span>`, esc(r.twin)]), 9))}`;
  const part = (arr, f, keys) => keys.map(([k, col]) => ({ v: cnt(arr, f, k), color: css(col) }));
  hstack($("#covChart"), [{ label: "Lubadused", parts: part(PROMISES, r => r[1], [["ok","--good"],["warn","--warn"],["crit","--crit"]]), txt: `${pOk}/${PROMISES.length}` }, { label: "Kasutusjuhud", parts: part(U, r => r.status, [["eelmudelis","--good"],["osaliselt","--warn"],["kaksik","--crit"]]), txt: `${uOk}/${U.length}` }], { lw: 100, desc: `Lubadustest ${pOk}/${PROMISES.length}, kasutusjuhtudest ${uOk}/${U.length} eelmudelis` });
}

/* 09 Andmed */
const DF = { group:"", status:"" };
const DST = { olemas:["ok","olemas"], hinnang:["warn","hinnang"], puudub:["crit","puudub"] }, DPER = { ei:["mut","ei"], pseud:["info","pseudonüümitud"], jah:["crit","jah"] };
function rAndmed() {
  const F = D.dictionary.fields, rows = D.dictionary.rows.map(r => Object.fromEntries(F.map((k, i) => [k, r[i]])));
  const groups = [...new Set(rows.map(r => r.group))], cnt = k => rows.filter(r => r.status === k).length, per = rows.filter(r => r.personal !== "ei").length;
  const vis = rows.filter(r => (!DF.group || r.group === DF.group) && (!DF.status || r.status === DF.status));
  $("#andmed-body").innerHTML = `
  <div class="box">${ttl(`Andmesõnastik · ${rows.length} näitajat · ${per} vajab kaksikus isikuandmeid (pseudonüümitud)`, `${cnt("olemas")} näitajat on avaandmetest olemas, ${cnt("hinnang")} on hinnang, ${cnt("puudub")} puudub`)}
    <div class="chart" id="dictChart"></div>${legend([{ name:"olemas", color:css("--good") }, { name:"hinnang", color:css("--warn") }, { name:"puudub", color:css("--crit") }])}
    ${more("Kõik näitajad", `<div style="display:flex;flex-wrap:wrap;align-items:end;gap:12px 16px">
      <div class="f"><label for="dfG">Valdkond</label><select id="dfG"><option value="">kõik</option>${groups.map(g => `<option ${g === DF.group ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></div>
      <div class="f"><label for="dfS">Seis</label><select id="dfS"><option value="">kõik</option>${Object.keys(DST).map(k => `<option value="${k}" ${k === DF.status ? "selected" : ""}>${DST[k][1]}</option>`).join("")}</select></div>
      <span class="small muted">${vis.length} rida · <code>data/dictionary.json</code></span></div>
      ${table(["Kood","Näitaja","Tase","Praegune allikas","Periood","Kaksiku sihtallikas","Isikuandmed","Seis","Märkus"], vis.map(r => [r.id, `<b>${esc(r.name)}</b><br><span class="small muted">${esc(r.unit)} · ${esc(r.modules)}</span>`, esc(r.level), esc(r.src) + (r.table && r.table !== "–" ? `<br><code>${esc(r.table)}</code>` : ""), `${esc(r.period)}<br><span class="muted">${esc(r.update)}</span>`, esc(r.target), `<span class="pill ${DPER[r.personal][0]}">${DPER[r.personal][1]}</span>`, `<span class="pill ${DST[r.status][0]}">${DST[r.status][1]}</span>`, `<span class="muted small">${esc(r.note)}</span>`]), 9)}`, !!(DF.group || DF.status))}</div>`;
  hstack($("#dictChart"), groups.map(g => { const R = rows.filter(r => r.group === g); return { label: g, parts: [["olemas","--good"],["hinnang","--warn"],["puudub","--crit"]].map(([k, c]) => ({ v: R.filter(r => r.status === k).length, color: css(c), name: k })), txt: String(R.length) }; }), { lw: 150, rw: 30, desc: "Näitajad valdkondade kaupa: " + groups.map(g => `${g} ${rows.filter(r => r.group === g).length}`).join(", ") });
  $("#dfG").onchange = e => { DF.group = e.target.value; rAndmed(); }; $("#dfS").onchange = e => { DF.status = e.target.value; rAndmed(); };
}

/* 10 Mootor */
function rMootor() {
  const pass = TESTS.filter(t => t.ok).length;
  $("#mootor-body").innerHTML = `
  <div class="box">${ttl(`Enesetest · mootor ${esc(E.VERSION)}`, pass === TESTS.length ? `Kõik ${TESTS.length} testi on läbitud; rahvaarv kattub põhimudeliga täpselt` : `${TESTS.length - pass} testi ${TESTS.length}-st ebaõnnestus`)}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">${TESTS.map(t => `<div title="${esc(t.name + " — " + t.detail)}" style="border:1px solid var(--line);border-left:4px solid var(${t.ok ? "--good" : "--crit"});border-radius:6px;padding:6px 9px;display:flex;flex-direction:column;gap:2px"><span class="mono small" style="color:var(${t.ok ? "--good" : "--crit"})">${t.ok ? "●" : "■"} ${t.id}</span><span class="small">${esc(t.name.split(/[(:—]/)[0].trim())}</span></div>`).join("")}</div>
    ${more("Testide üksikasjad", table(["Test","Kontroll","Tulemus","Detail"], TESTS.map(t => [t.id, esc(t.name), `<span class="pill ${t.ok ? "ok" : "crit"}">${t.ok ? "läbitud" : "ebaõnnestus"}</span>`, `<span class="mono small">${esc(t.detail)}</span>`]), 9) + `<p class="note">T1–T6b ja T12 võrdlevad põhimudeliga (kohortmudel v6) failis <code>data/reference.json</code>, mille koostab <code>tools/rak_reference.js</code>. T13–T15 kontrollivad otsuseid E2–E10. Node'is: <code>node engine.test.js</code>.</p>`)}</div>
  ${more("Funktsioonid", table(["Funktsioon","Sisend","Väljund","Kirjeldus"], E.API.map(a => [`<code>${esc(a.fn)}</code>`, esc(a.in), esc(a.out), `<span class="muted">${esc(a.desc)}</span>`]), 9))}
  ${more("Failid", table(["Fail","Sisu"], [["engine.js","Arvutusmootor (referentsimplementatsioon)"],["engine.test.js","Enesetestide käivitaja Node'is"],["data/kov.json","Omavalitsuste konfiguratsioon ja mudeli parameetrid"],["data/pop.json","Rahvastik, sünnid, surmad, ränne (RV0282U, RV112U, RV49U, RVR02)"],["data/fin.json","Eelarve täitmine (RR300), tulumaks (MTA), eelarvestrateegiad"],["data/edu.json","Lasteaialapsed, õpilased, koolid"],["data/ext.json","Välisränne, eluiga, eluruumid, pendelränne, kulud, prognoosid"],["data/settlements.json","Asulad (REL 2021, RL21003)"],["data/dictionary.json","Andmesõnastik"],["data/usecases.json","Kasutusjuhtude kataloog"],["data/reference.json","Põhimudeli väljundid testide jaoks"]].map(r => [`<code>${r[0]}</code>`, esc(r[1])]), 9))}`;
}

/* 11 Konfiguratsioon */
function rKonf() {
  $("#konf-body").innerHTML = `
  <div class="box">${ttl("Omavalitsused failist data/kov.json", `${unitsAll().length} omavalitsust; Rae on lisatud ainult konfiguratsiooniga, koodi muutmata`)}
  ${table(["Id","Nimi","Piirkond","Eluea viide","Haridusandmed","Maakonnas","Pilootvald","Arengukava siht"], unitsAll().map(u => [`<span class="mono">${u.id}</span>`, dot(u.id) + esc(u.name), `<span class="mono">${u.region}</span>`, esc(u.e0Ref) + " maakond", u.edu === "hinnang" ? '<span class="pill warn">hinnang</span>' : '<span class="pill ok">andmed</span>', u.inMaak ? "jah" : "ei", u.pilot ? '<span class="pill dev">jah</span>' : "–", u.target ? f0(u.target.pop) + " (" + u.target.year + ")" : '<span class="muted">puudub</span>']), 9)}
  ${more("Uue omavalitsuse lisamine", `<ol class="steps">
      <li>Lisa kirje faili <code>data/kov.json</code>: id, nimi, värv, piirkond ja eluea viitemaakond.</li>
      <li>Lisa rahvastikuandmed faili <code>data/pop.json</code> (RV0282U, RV112U, RV49U, RVR02).</li>
      <li>Lisa eelarve (RR300) faili <code>data/fin.json</code>; välisränne, pendelränne ja eluruumid faili <code>data/ext.json</code>.</li>
      <li>Lisa asulad (RL21003) faili <code>data/settlements.json</code> ja koolidega asulad faili <code>data/edu.json</code>.</li>
      <li>Kui haridusandmeid ei ole, märgi <code>"edu":"hinnang"</code>.</li>
      <li>Ava leht: enesetest kontrollib andmete kooskõla.</li></ol>`)}
  ${more("Rae vald pilootvallana", `<p class="note">Rae andmed on Statistikaameti API-st (09.10.2026). Rae sündimuse ja eluea trend arvutatakse Rae ja Harju maakonna andmetest. Vallalt on vaja: laste ja õpilaste arv, ühikukulud, tulumaksu 2026 kuuandmed, eelarvestrateegia ja netovõlg, kohtade arv ning arengukava siht. Koolid: ${esc(D.edu.raeSchools.join(", "))}.</p>`)}</div>`;
}

/* ---------- juhtimine ---------- */
function renderAll() {
  projCache.clear();
  [rYlevaade, rRahvastik, rElamu, rInvest, rOtsus, rLiikuvus, rTapsus].forEach(f => { try { f(); } catch (e) { console.error(f.name, e); } });
}
function bar() {
  const opts = [...D.kov.aggregates.map(a => ({ ...a, agg: true })), ...unitsAll()];
  $("#unitSeg").innerHTML = opts.map(u => `<button type="button" data-u="${u.id}" aria-pressed="${u.id === S.unit}" style="--c:${u.color}"><i></i>${esc(u.short)}${u.pilot ? "<sup>pilot</sup>" : ""}</button>`).join("");
  $("#unitSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.unit = b.dataset.u; [...$("#unitSeg").children].forEach(x => x.setAttribute("aria-pressed", x.dataset.u === S.unit)); HI.unit = null; OT.unit = null; renderAll(); };
  $("#migSel").innerHTML = Object.entries(D.kov.params.migPatterns).map(([k, v]) => `<option value="${k}" ${k === S.mig ? "selected" : ""}>${v}</option>`).join("");
  $("#migSel").onchange = e => { S.mig = e.target.value; renderAll(); };
  $("#extraIn").onchange = e => { S.extra = +e.target.value || 0; renderAll(); };
  $("#fertIn").oninput = e => { S.fert = +e.target.value; $("#fertOut").textContent = (S.fert > 0 ? "+" : S.fert < 0 ? "−" : "±") + Math.abs(S.fert) + "%"; };
  $("#fertIn").onchange = () => renderAll();
  $("#bar").hidden = false;
}
async function boot() {
  try {
    const got = await Promise.all(FILES.map(f => fetch("data/" + f + ".json").then(r => { if (!r.ok) throw new Error("data/" + f + ".json: " + r.status); return r.json(); })));
    D = Object.fromEntries(FILES.map((f, i) => [f, got[i]]));
    ctx = E.build({ kov: D.kov, pop: D.pop, fin: D.fin, edu: D.edu, ext: D.ext, settlements: D.settlements });
    TESTS = E.selfTest(ctx, D.reference);
  } catch (err) {
    $("#app").className = ""; $("#app").innerHTML = `<div class="loaderr">Andmefailide laadimine ebaõnnestus: ${esc(err.message)}. Värskenda lehte; kui viga jääb, on andmefail puudu.</div>`; console.error(err); return;
  }
  const pass = TESTS.filter(t => t.ok).length;
  $("#hdrBadges").innerHTML = `<span class="badge ${pass === TESTS.length ? "ok" : "bad"}">Testid ${pass}/${TESTS.length}</span><span class="badge">Mootor <b>${esc(E.VERSION.split(" ")[0])}</b></span><span class="badge">Andmed <b>10.10.2026</b></span><a class="badge" href="https://claude.ai/artifact/1z4kbsLU2uneuJwJYuNVfG" target="_blank" rel="noopener">Põhimudel ↗</a>`;
  shell(); bar(); renderAll(); rKasutus(); rAndmed(); rMootor(); rKonf();
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { renderAll(); rKasutus(); rAndmed(); }, 250); });
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}
boot();
})();
</script>
