name: Ühistransport (GTFS)
# Käsitsi: laeb Transpordiameti GTFS-voogud (raplamaa, harjumaa, elron, tallinn), arvutab tools/gtfs.js abil
# 14 päeva väljumised ja otseühendused ning salvestab data/transit/<vald>.json. Vt docs/gtfs.md.
on:
  workflow_dispatch:
    inputs:
      vallad: { description: "Vallad komaga (tühi = kõik viis)", required: false, default: "" }
      start: { description: "Esimene päev YYYY-MM-DD (tühi = järgmine esmaspäev)", required: false, default: "" }
permissions:
  contents: write
  actions: write
jobs:
  gtfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Testid
        run: node tests/gtfs.test.js
      - name: Lae ja töötle GTFS
        env: { VALLAD: "${{ inputs.vallad }}", START: "${{ inputs.start }}" }
        run: |
          ARGS=""
          if [ -n "$VALLAD" ]; then ARGS="$ARGS --vallad $VALLAD"; fi
          if [ -n "$START" ]; then ARGS="$ARGS --start $START"; fi
          node --max-old-space-size=6144 tools/gtfs.js $ARGS | tee yt.txt
          while IFS= read -r line; do echo "::notice title=Ühistransport::${line:0:3900}"; done < yt.txt
          for f in data/transit/*.json; do
            s=$(stat -c %s "$f"); if [ "$s" -gt 1572864 ]; then echo "::warning title=Suur fail::$f $s baiti"; fi
          done
      - name: Salvesta
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -z "$(git status --porcelain data/transit/)" ]; then echo "Muudatusi ei ole"; exit 0; fi
          git config user.name "yt-uuendus"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/transit/
          git commit -m "Ühistransport (GTFS) $(date +%Y-%m-%d)" -m "$(cat yt.txt)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          gh workflow run ci.yml --ref main
