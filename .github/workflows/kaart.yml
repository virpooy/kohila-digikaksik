name: Kaardi aluskiht
# Käsitsi: laeb OpenStreetMapist kaardikihid (tools/osm_kaart.js) ja salvestab data/map.json.
on:
  workflow_dispatch:
    inputs:
      vallad: { description: "Vallad komaga (tühi = kõik)", required: false, default: "" }
permissions:
  contents: write
  actions: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Lae kaardikihid
        run: |
          set +e; node tools/osm_kaart.js ${{ inputs.vallad }} > kaart.txt 2>&1; rc=$?; set -e
          echo "::notice title=Kaart::$(tr '\n' ' ' < kaart.txt | cut -c1-3500)"
          echo "rc=$rc" >> $GITHUB_ENV
      - name: Salvesta
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then echo "Muudatusi ei ole"; exit 0; fi
          git config user.name "kaardi-uuendus"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          git commit -m "Kaardi aluskiht $(date +%Y-%m-%d)" -m "$(cat kaart.txt)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push && break; sleep 10; done
          gh workflow run ci.yml --ref main
          if [ "$rc" != "0" ]; then echo "::warning title=Kaart::osa kihte jäi uuendamata (vt teadet)"; fi
